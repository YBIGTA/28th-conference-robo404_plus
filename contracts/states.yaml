decision_states:
  - "IDLE"
  - "FOLLOW_LINE"
  - "STOP_FOR_RED"
  - "WAIT_GREEN"
  - "LINE_LOST"
  - "FINAL_STOP"

traffic_light_states:
  - "UNKNOWN"
  - "RED"
  - "GREEN"

decision_rules:
  priority_order:
    - state: "IDLE"
      command: "zero Twist"
      reason: "주행 비활성 상태"
    - state: "LINE_LOST"
      command: "zero Twist"
      reason: "라인 유실"
    - state: "STOP_FOR_RED"
      command: "zero Twist"
      reason: "빨간불 감지"
    - state: "WAIT_GREEN"
      command: "zero Twist"
      reason: "빨간불 이후 초록불 대기"
    - state: "FOLLOW_LINE"
      command: "pass /cmd_vel_line"
      reason: "라인 정상 인식 및 주행 가능"
    - state: "FINAL_STOP"
      command: "zero Twist"
      reason: "최종 정지"

  unknown_traffic_light_policy:
    before_red_stop: "FOLLOW_LINE 유지"
    after_red_stop: "WAIT_GREEN 유지"
