# Auto-labelling config for the Gazebo recorder.

# YOLO classes (order = class id). Traffic lights are split into red/green so the
# detector outputs the state directly (no runtime HSV needed).
classes:
  - red_light
  - green_light
  - obstacle

# base_footprint -> camera_optical_link, as a chain of {xyz, rpy} links.
# Defaults match the robo_description URDF; update if you change the camera mount.
camera_chain:
  - {xyz: [0.0, 0.0, 0.033], rpy: [0.0, 0.0, 0.0]}        # base_footprint -> base_link
  - {xyz: [0.10, 0.0, 0.06], rpy: [0.0, 0.5, 0.0]}        # base_link -> camera_link
  - {xyz: [0.0, 0.0, 0.0], rpy: [-1.5708, 0.0, -1.5708]}  # camera_link -> camera_optical_link

# Gazebo model-name substring -> object spec.
#   type: traffic_light  -> class becomes red_light/green_light from /traffic_light/state
#   type: static         -> uses the fixed 'class'
# half_extents are HALF the object's bounding box size in metres (x, y, z).
objects:
  traffic_light:
    type: traffic_light
    half_extents: [0.05, 0.05, 0.15]
  obstacle:
    type: static
    class: obstacle
    half_extents: [0.10, 0.10, 0.10]
