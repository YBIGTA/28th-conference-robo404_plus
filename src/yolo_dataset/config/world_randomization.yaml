# Domain-randomization ranges for world generation.
# Each field is [min, max] (uniform) unless noted otherwise.

num_worlds: 20

sun:
  # Diffuse RGB channels (each independently sampled)
  diffuse_r: [0.5, 1.0]
  diffuse_g: [0.5, 1.0]
  diffuse_b: [0.5, 1.0]
  # Specular intensity (grey)
  specular: [0.05, 0.4]
  # Direction vector components (unnormalised, Gazebo normalises internally)
  dir_x: [-0.8, 0.2]
  dir_y: [-0.5, 0.5]
  dir_z: [-1.0, -0.4]

ground:
  # Gazebo built-in material names (sampled uniformly)
  materials:
    - Gazebo/White
    - Gazebo/Grey
    - Gazebo/DarkGrey
    - Gazebo/FlatBlack
    - Gazebo/WhiteGlow

track:
  line_width: [0.08, 0.14]
  # Segment 1 length (straight)
  seg1_length: [4.0, 8.0]
  # Angled segment lateral offset
  seg2_lateral: [0.5, 2.0]
  seg2_forward: [1.5, 3.0]
  # Segment 3 length (straight)
  seg3_length: [4.0, 8.0]
  materials:
    - Gazebo/Black
    - Gazebo/DarkGrey

traffic_light:
  # Offset from the end of segment 1, perpendicular to track
  lateral_offset: [-1.2, -0.5]
  # Height of the light pole
  pole_height: [0.3, 0.6]
  # Head box scale factor (1.0 = default 0.2x0.2x0.7)
  head_scale: [0.8, 1.2]
  # Light disc radius
  disc_radius: [0.04, 0.08]
  # Use realistic model from Gazebo DB (probability)
  realistic_prob: 0.3

obstacle:
  # How far along segment 3 (fraction 0-1) to place the obstacle
  along_seg3: [0.3, 0.9]
  # Size of box (each axis independently)
  size_x: [0.3, 0.7]
  size_y: [0.3, 0.7]
  size_z: [0.3, 0.7]
  materials:
    - Gazebo/Red
    - Gazebo/Orange
    - Gazebo/Yellow
    - Gazebo/Blue
    - Gazebo/Green
    - Gazebo/Purple
    - Gazebo/White

distractors:
  # Number of random distractor objects to add
  count: [0, 4]
  # Distance from track centreline
  distance: [0.5, 2.5]
  # Size range
  size: [0.1, 0.5]
  materials:
    - Gazebo/Red
    - Gazebo/Blue
    - Gazebo/Green
    - Gazebo/Yellow
    - Gazebo/Grey
    - Gazebo/Orange
    - Gazebo/White
